<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" aria-hidden="true">
  <filter id="paper-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="saturate" values="0" result="gray" />
    <feComponentTransfer in="gray">
      <feFuncA type="table" tableValues="0 0.18" />
    </feComponentTransfer>
  </filter>
  <rect width="160" height="160" filter="url(#paper-grain)" />
</svg>
